services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"

  swagger:
    image: swaggerapi/swagger-ui
    ports:
      - "8081:8080"
    environment:
      - SWAGGER_JSON=/spec/swagger.json
    volumes:
      - ./docs/swagger.json:/spec/swagger.json

  auth-service:
    build: ./auth-service
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://user:password@postgres:5432/identity_db
      - JWT_SECRET=school-admin-secret-key

  academic-service:
    build: ./academic-service
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - DATABASE_URL=postgresql://user:password@postgres:5432/academic_db

  attendance-service:
    build: ./attendance-service
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - DATABASE_URL=postgresql://user:password@postgres:5432/attendance_db
      - REDIS_URL=redis://redis:6379

  billing-service:
    build: ./billing-service
    ports:
      - "4003:4003"
    environment:
      - PORT=4003
      - DATABASE_URL=postgresql://user:password@postgres:5432/billing_db

  comms-service:
    build: ./comms-service
    ports:
      - "4004:4004"
    environment:
      - PORT=4004

  ai-service:
    build: ./ai-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - OLLAMA_HOST=172.17.0.1
      - OLLAMA_PORT=11434
      - AI_MODEL=qwen2.5-coder:7b
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: identity_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d identity_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
