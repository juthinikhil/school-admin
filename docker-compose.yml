version: '3.8'

services:
  auth:
    build: ./auth
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=your_secret_key

  academics:
    build: ./academics
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=academics

  attendance:
    build: ./attendance
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=attendance

  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=academics
